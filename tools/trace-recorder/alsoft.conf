# OpenAL Soft 1.15.1 settings for the ORIGINAL game's bundled openal.dylib when it
# runs under Rosetta 2 (passed only to that process via ALSOFT_CONF by
# launch_original.sh; no game file changes).
#
# The default sinc resampler is costly when translated and, with the single-threaded
# engine (-ONETHREAD), the mixer misses CoreAudio deadlines -> crackling. Mix at the
# output device's rate (AirPlay/TV and most outputs run 44.1 or 48 kHz) with the
# cheaper linear resampler and larger buffers.
[general]
frequency = 44100
resampler = linear
period_size = 2048
periods = 6
