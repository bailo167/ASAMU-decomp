[package]
name = "asamu"
description = "A Story About My Uncle — Rust/Bevy engine recreation (executable)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
asamu-assets.workspace = true
asamu-core.workspace = true
asamu-game.workspace = true
asamu-player.workspace = true
# Sandbox mode (experimental, ours): compiled in by default, removable with
# `--no-default-features`. See `src/sandbox.rs`.
asamu-sandbox = { workspace = true, optional = true }
bevy.workspace = true

[features]
default = ["sandbox"]
# The in-app Sandbox (launcher, inspector, live tuning, time control). The
# feature exists on this crate only: nothing under `crates/` or `tools/` is
# compiled differently by it.
sandbox = ["dep:asamu-sandbox"]

[lints]
workspace = true
